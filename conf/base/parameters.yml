# Sprint 2 — parametry pipeline'u.
# TODO (zespół): dodaj test_size, random_state i inne parametry zgodne
# z project.yaml oraz kontraktem wybranego datasetu.
dataset_name: iranian_churn
target_column: Churn

split:
  test_size: 0.2
  random_state: 42
  stratify: true

model:
  random_state: 42
  max_iter: 1000

data_mode: full

wandb:
  enabled: true
  entity: "s29759-asi-project"
  project: "asi-projekt"

autogluon:
  enabled: true
  path: data/06_models/autogluon
  eval_metric: f1
  configurations:
    medium_60s:
      presets: medium
      time_limit: 60
    best_960s:
      presets: best
      time_limit: 960
